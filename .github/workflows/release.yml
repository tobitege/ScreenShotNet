name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (example: 0.1.0, without v prefix)"
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate version format
        id: validate
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format. Use semantic versioning (example: 0.1.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build_release_zips:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      cli_zip_name: ${{ steps.package.outputs.cli_zip_name }}
      mcp_zip_name: ${{ steps.package.outputs.mcp_zip_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build ScreenShotNet (net48, Release)
        shell: pwsh
        run: dotnet build .\src\ScreenShotNet.csproj -c Release -f net48

      - name: Build ScreenShotNet.Mcp (net8.0-windows, Release)
        shell: pwsh
        run: dotnet build .\src\ScreenShotNet.Mcp\ScreenShotNet.Mcp.csproj -c Release

      - name: Package release outputs as zip
        id: package
        shell: pwsh
        run: |
          $cliZipName = "ScreenShotNet-net48-v${{ needs.validate.outputs.version }}.zip"
          $cliOutputDir = "src/bin/Release/net48"
          if (!(Test-Path "$cliOutputDir/ScreenShotNet.exe")) {
            throw "CLI build output not found at $cliOutputDir"
          }

          $mcpZipName = "ScreenShotNet.Mcp-net8.0-windows-v${{ needs.validate.outputs.version }}.zip"
          $mcpOutputDir = "src/ScreenShotNet.Mcp/bin/Release/net8.0-windows"
          if (!(Test-Path "$mcpOutputDir/ScreenShotNet.Mcp.exe")) {
            throw "MCP build output not found at $mcpOutputDir"
          }

          $skillsSourceDir = "skills"
          if (!(Test-Path "$skillsSourceDir/ScreenShotNet/SKILL.md")) {
            throw "Skills content not found at $skillsSourceDir"
          }

          $cliStageDir = Join-Path $env:RUNNER_TEMP "ScreenShotNet-net48"
          $mcpStageDir = Join-Path $env:RUNNER_TEMP "ScreenShotNet.Mcp-net8.0-windows"
          Remove-Item -Recurse -Force $cliStageDir -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $mcpStageDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $cliStageDir | Out-Null
          New-Item -ItemType Directory -Path $mcpStageDir | Out-Null

          Copy-Item -Path "$cliOutputDir/*" -Destination $cliStageDir -Recurse
          Copy-Item -Path "$mcpOutputDir/*" -Destination $mcpStageDir -Recurse
          Copy-Item -Path $skillsSourceDir -Destination $mcpStageDir -Recurse

          Compress-Archive -Path "$cliStageDir/*" -DestinationPath $cliZipName -Force
          Compress-Archive -Path "$mcpStageDir/*" -DestinationPath $mcpZipName -Force

          "cli_zip_name=$cliZipName" >> $env:GITHUB_OUTPUT
          "mcp_zip_name=$mcpZipName" >> $env:GITHUB_OUTPUT

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-zips
          path: |
            ${{ steps.package.outputs.cli_zip_name }}
            ${{ steps.package.outputs.mcp_zip_name }}
          if-no-files-found: error

  publish_release:
    needs: [validate, build_release_zips]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Download zip artifact
        uses: actions/download-artifact@v8
        with:
          name: release-zips
          path: ./release-artifacts

      - name: Extract changelog section
        id: changelog
        run: |
          VERSION="${{ needs.validate.outputs.version }}"

          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md not found in repository root."
            exit 1
          fi

          CHANGELOG_SECTION="$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" || $0 ~ "^## " ver "([[:space:]]|$)" || $0 ~ "^## v" ver "([[:space:]]|$)" {
              capture=1
            }
            capture && /^## / && $0 !~ "^## \\[" ver "\\]" && $0 !~ "^## " ver "([[:space:]]|$)" && $0 !~ "^## v" ver "([[:space:]]|$)" {
              exit
            }
            capture { print }
          ' CHANGELOG.md)"

          if [ -z "$CHANGELOG_SECTION" ]; then
            echo "::error::No changelog entry found for version $VERSION in CHANGELOG.md."
            exit 1
          fi

          {
            echo 'body<<EOF'
            echo "$CHANGELOG_SECTION"
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "v${{ needs.validate.outputs.version }}"
          target_commitish: ${{ github.sha }}
          files: ./release-artifacts/*.zip
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## Release Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ needs.validate.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- CLI Asset: ${{ needs.build_release_zips.outputs.cli_zip_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- MCP Asset: ${{ needs.build_release_zips.outputs.mcp_zip_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.validate.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
