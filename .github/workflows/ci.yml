name: CI Build

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Build net48 app and test project
        shell: pwsh
        run: ./scripts/build_desktop.ps1 -Configuration Release -IncludeTests

      - name: Run net48 tests
        shell: pwsh
        run: dotnet vstest "tests/ScreenShotNet.Tests/bin/Release/net48/ScreenShotNet.Tests.dll"

      - name: Build MCP server
        shell: pwsh
        run: dotnet build ./src/ScreenShotNet.Mcp/ScreenShotNet.Mcp.csproj -c Release

      - name: Test MCP stdio server
        shell: pwsh
        run: |
          ./scripts/test_mcp.ps1 -Configuration Release
          ./scripts/test_mcp.ps1 -Configuration Release -ProtocolVersion 2025-11-25

      - name: Upload MCP diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: mcp-smoke-diagnostics
          path: buildlog.mcp-smoke-*.log
          if-no-files-found: ignore
